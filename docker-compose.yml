services:
  dip-lab:
    image: avaya-infinity-dip-lab:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avaya-infinity-dip-lab
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_KEY: ${API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!2026}
      SESSION_SECRET: ${SESSION_SECRET:-dip-lab-change-this-session-secret}
    volumes:
      - dip-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dip-data:
